<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div class="main">
       
        <div class="screen">
           <h1 id="display">0</h1>
        </div>
        <div class="clear">
            <button><h1>CLR</h1></button>
        </div>
        <div class="plus">
            <button><h1>+</h1></button>
        </div>
        <div class="minus">
          <button> <h1>-</h1></button> 
        </div>
        <div class="divide">
            <button><h1>/</h1></button>
        </div>
        <div class="multiply">
            <button><h1>*</h1></button>
        </div>
        <div class="one">
            <button><h1>1</h1></button>
        </div>
        <div class="two">
           <button> <h1>2</h1></button>
        </div>
        <div class="three">
            <button><h1>3</h1></button>
        </div>
        <div class="four">
            <button><h1>4</h1></button>
        </div>
        <div class="five">
           <button><h1>5</h1></button> 
        </div>
        <div class="six">
            <button><h1>6</h1></button>
        </div>
        <div class="seven">
            <button><h1>7</h1></button>
        </div>
        <div class="eight">
            <button><h1>8</h1></button>
        </div>
        <div class="nine">
            <button><h1>9</h1></button>
        </div>
        <div class="zero">
            <button><h1>0</h1></button>
        </div>
        <div class="equals"> 
            <button><h1>=</h1></button> 
        </div>
        <div class="dot">
            <button><h1>.</h1></button>
        </div>


    </div>
    <script>
        const display=document.getElementById("display");
        const buttons= document.querySelectorAll(".main button");
        let currentInput="";
        buttons.forEach (function (button){
            button.addEventListener("click" ,()=>{
                const value=button.innerText;
               /* currentInput+=value;*/
                display.innerText=currentInput;

                if(value==="CLR"){
                    currentInput="";
                    display.innerText="0";
                    return;
                }
                if(value==="="){
                    try{
                        currentInput =eval(currentInput)
                        display.innerText=currentInput;
                     }catch(error){
                        display.innerText=("Error")
                        currentInput="";
                     }
                     return;
                }
                currentInput+=value;
                display.innerText=currentInput;
            });
        })
        
        
    </script>
</body>
</html>
